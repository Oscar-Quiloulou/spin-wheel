<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🔥 MAX HEAT v6 — Dual iOS / WASM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none; }
  html, body {
    height: 100%; width: 100%; position: fixed;
    overflow: hidden; overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    background: #000; color: #eee;
    font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #warning {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 40%, #2a1200, #050300 75%);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .warn-card {
    max-width: 700px; width: 100%;
    background: linear-gradient(160deg, #1a0e02, #080400);
    border: 1px solid #ff880055; border-radius: 22px;
    padding: 32px 36px; text-align: center;
    box-shadow: 0 0 120px #ff660033, inset 0 0 60px #ff660008;
  }
  .warn-card h1 {
    font-size: 28px; color: #ffaa22; margin-bottom: 14px;
    letter-spacing: 2px;
    text-shadow: 0 0 30px #ff8800cc, 0 0 60px #ff660088;
    animation: flicker 1.2s infinite;
  }
  @keyframes flicker {
    0%,100% { opacity: 1; } 42% { opacity: 1; }
    45% { opacity: .65; } 48% { opacity: 1; }
    72% { opacity: .85; } 76% { opacity: 1; }
  }
  .warn-card p { color: #c9c9d9; line-height: 1.55; margin-bottom: 10px; font-size: 14px; }
  .warn-card strong { color: #ffcc44; }
  .warn-card ul {
    text-align: left; display: inline-block;
    color: #aa9988; font-size: 13px;
    margin: 8px 0 16px; line-height: 1.85; list-style: none;
  }
  .warn-card li::before { content: "▸ "; color: #ff8800; font-weight: bold; }
  .mode-box {
    display: inline-block;
    padding: 14px 22px;
    border-radius: 12px;
    margin: 6px 0 16px;
    font-size: 14px;
    line-height: 1.5;
    border: 1px solid;
  }
  .mode-ios {
    background: #0066ff11;
    border-color: #0066ff55;
    color: #7fb8ff;
  }
  .mode-wasm {
    background: #00ff8811;
    border-color: #00ff8855;
    color: #7fffb8;
  }
  .mode-box strong { display: block; font-size: 16px; margin-bottom: 4px; letter-spacing: 1.5px; }
  .btn {
    border: none; padding: 18px 40px;
    font-size: 16px; font-weight: 800; border-radius: 14px;
    cursor: pointer; transition: transform .12s;
    letter-spacing: 1.5px; font-family: inherit;
    text-transform: uppercase; min-height: 60px; min-width: 260px;
    touch-action: manipulation;
  }
  .btn-start {
    background: linear-gradient(135deg, #ff8800, #ffcc00, #ff8800);
    background-size: 200% 200%; color: #1a0800;
    box-shadow: 0 0 40px #ff880088, 0 6px 30px #ff880055;
    animation: shift 2s ease infinite;
  }
  @keyframes shift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .btn-start:active { transform: scale(0.96); }
  .btn-stop {
    background: linear-gradient(135deg, #0055ff, #00e0ff);
    color: white; box-shadow: 0 0 40px #0066ff88;
  }
  .btn-stop:active { transform: scale(0.96); }

  #app { position: fixed; inset: 0; display: none; }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(14px, env(safe-area-inset-left));
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 10; pointer-events: none;
    background: linear-gradient(180deg, #000000cc, transparent 75%);
    font-variant-numeric: tabular-nums;
  }
  .hud-block { display: flex; flex-direction: column; gap: 1px; }
  .hud-label {
    font-size: 9px; letter-spacing: 3px; color: #ffffff55;
    text-transform: uppercase; font-weight: 700;
  }
  .hud-value {
    font-size: 22px; font-weight: 900; line-height: 1.1;
    text-shadow: 0 0 30px currentColor;
  }
  .hud-sub { font-size: 10px; color: #ffffff44; letter-spacing: 0.5px; }
  #tempBar {
    position: absolute; bottom: env(safe-area-inset-bottom);
    left: 0; right: 0; height: 10px;
    background: #ffffff08; z-index: 10;
  }
  #tempFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #00ff88, #ffcc00, #ff8800, #ff0000, #ff00ff);
    box-shadow: 0 0 40px #ff6600, 0 0 80px #ff440088;
    transition: width .2s;
  }
  #stopWrap {
    position: absolute;
    bottom: max(40px, calc(env(safe-area-inset-bottom) + 22px));
    left: 50%; transform: translateX(-50%); z-index: 20;
  }
  #fps {
    position: absolute;
    bottom: max(18px, calc(env(safe-area-inset-bottom) + 2px));
    right: max(18px, env(safe-area-inset-right));
    z-index: 11; pointer-events: none;
    font-variant-numeric: tabular-nums;
    font-size: 11px; letter-spacing: 1.5px;
    color: #ffffff66; text-transform: uppercase;
  }
  #modeTag {
    position: absolute;
    bottom: max(18px, calc(env(safe-area-inset-bottom) + 2px));
    left: max(18px, env(safe-area-inset-left));
    z-index: 11; pointer-events: none;
    font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 700;
  }
  #generationBanner {
    position: absolute;
    top: 45%; left: 50%; transform: translate(-50%, -50%);
    z-index: 15; pointer-events: none;
    font-size: 38px; font-weight: 900;
    color: #ffcc00; letter-spacing: 4px;
    text-shadow: 0 0 40px #ff8800, 0 0 80px #ff4400;
    opacity: 0; transition: opacity .3s;
    text-align: center;
  }
  #generationBanner.show {
    opacity: 1;
    animation: genPulse 1.5s ease-out;
  }
  @keyframes genPulse {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
  }
</style>
</head>
<body>

<div id="warning">
  <div class="warn-card">
    <div class="danger-tag" id="modeTagWarn" style="display:inline-block;padding:5px 14px;border-radius:4px;background:#ff880022;border:1px solid #ff880066;color:#ffaa44;font-size:11px;letter-spacing:4px;text-transform:uppercase;margin-bottom:16px;">Détection…</div>
    <h1 id="titleWarn">MAX HEAT v6</h1>
    <p id="descWarn">Détection du système en cours…</p>
    <div id="modeBox" class="mode-box mode-ios" style="visibility:hidden">
      <strong id="modeName">—</strong>
      <span id="modeDetails">—</span>
    </div>
    <ul id="featuresList"></ul>
    <br>
    <button class="btn btn-start" id="startBtn">🔥 LANCER</button>
  </div>
</div>

<div id="app">
  <canvas id="gl"></canvas>
  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Génération</div>
      <div class="hud-value" id="genEl" style="color:#ffaa22">1</div>
      <div class="hud-sub" id="donutsEl">—</div>
    </div>
    <div class="hud-block" style="text-align:center">
      <div class="hud-label">Calculs / pixel</div>
      <div class="hud-value" id="opsEl" style="color:#ff4400">—</div>
      <div class="hud-sub" id="engineEl">—</div>
    </div>
    <div class="hud-block" style="text-align:right">
      <div class="hud-label">Temps</div>
      <div class="hud-value" id="timer" style="color:#00e0ff">00:00</div>
      <div class="hud-sub" id="resEl">—</div>
    </div>
  </div>
  <div id="tempBar"><div id="tempFill"></div></div>
  <div id="fps">—</div>
  <div id="modeTag"></div>
  <div id="generationBanner">GÉN 2</div>
  <div id="stopWrap">
    <button class="btn btn-stop" id="stopBtn">■ STOP</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ==================================================================
  // DÉTECTION iOS / Desktop
  // ==================================================================
  const isIPad = /iPad/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isIPhone = /iPhone|iPod/.test(navigator.userAgent);
  const isIOS = isIPad || isIPhone;
  const isDesktopOS = !isIOS;

  // ==================================================================
  // MODULE WASM ÉCRIT À LA MAIN
  // Fonction exportée : burn(i32) -> f64
  //   - boucle serrée de 10 itérations de calcul flottant par itération
  //   - utilise une carte chaotique (x = 4x(1-x)) qui reste bornée
  // ==================================================================
  // Format binaire WASM (voir explications après le code)
  const WASM_BYTES = new Uint8Array([
    // Header
    0x00, 0x61, 0x73, 0x6D, 0x01, 0x00, 0x00, 0x00,
    // Type section: (func (param i32) (result f64))
    0x01, 0x07, 0x01, 0x60, 0x01, 0x7F, 0x01, 0x7C,
    // Function section: [type 0]
    0x03, 0x02, 0x01, 0x00,
    // Export section: "burn" -> func 0
    0x07, 0x08, 0x01, 0x04, 0x62, 0x75, 0x72, 0x6E, 0x00, 0x00,
    // Code section
    0x0A, 0x54, 0x01, 0x52,
    // Local declarations: 1 group, 2× f64
    0x02, 0x02, 0x7C,
    // Body instructions
    0x44, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xE0, 0x3F,  // f64.const 0.5
    0x21, 0x01,                                              // local.set 1
    0x44, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,  // f64.const 0
    0x21, 0x02,                                              // local.set 2
    0x02, 0x40,                                              // block
    0x03, 0x40,                                              // loop
    0x20, 0x00, 0x45,                                        // local.get 0; i32.eqz
    0x0D, 0x01,                                              // br_if 1
    0x44, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x10, 0x40,  // f64.const 4
    0x20, 0x01, 0xA2,                                        // local.get 1; f64.mul
    0x44, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xF0, 0x3F,  // f64.const 1
    0x20, 0x01, 0xA1,                                        // local.get 1; f64.sub
    0xA2,                                                    // f64.mul
    0x21, 0x01,                                              // local.set 1
    0x20, 0x02, 0x20, 0x01, 0xA0,                            // y = y + x
    0x21, 0x02,                                              // local.set 2
    0x20, 0x00, 0x41, 0x01, 0x6B, 0x21, 0x00,                // i--
    0x0C, 0x00,                                              // br 0
    0x0B, 0x0B,                                              // end loop; end block
    0x20, 0x02, 0x0B                                         // local.get 2; end func
  ]);

  // ==================================================================
  // CONFIGURATION SELON LE MODE
  // ==================================================================
  const CONFIG = isIOS ? {
    mode: 'ios',
    modeLabel: '🍎 Mode iOS',
    modeDesc: 'WebGL2 fractal + Workers JS',
    dprCap: 2.0,
    workerMultiplier: 2,
    maxGen: 5,
    genIntervalMs: 15000,
    engine: 'WebGL + JS Workers',
  } : {
    mode: 'wasm',
    modeLabel: '💻 Mode Desktop — WASM',
    modeDesc: 'WebGL2 fractal + Workers WASM multithreadés',
    dprCap: 2.5,
    workerMultiplier: 4,      // ×4 = oversubscription agressive
    maxGen: 6,                // va plus loin que iOS
    genIntervalMs: 12000,
    engine: 'WebGL + WASM',
  };

  // Met à jour l'écran d'avertissement selon le mode détecté
  const modeTagWarn = document.getElementById('modeTagWarn');
  const titleWarn = document.getElementById('titleWarn');
  const descWarn = document.getElementById('descWarn');
  const modeBox = document.getElementById('modeBox');
  const modeName = document.getElementById('modeName');
  const modeDetails = document.getElementById('modeDetails');
  const featuresList = document.getElementById('featuresList');

  modeTagWarn.textContent = isIOS ? '🍎 iOS détecté' : '💻 Desktop détecté';
  modeBox.className = 'mode-box ' + (isIOS ? 'mode-ios' : 'mode-wasm');
  modeBox.style.visibility = 'visible';
  modeName.textContent = CONFIG.modeLabel;
  modeDetails.textContent = CONFIG.modeDesc;

  if (isIOS) {
    titleWarn.textContent = 'DONUT FRACTAL — iOS';
    descWarn.innerHTML = 'Moteur <strong>WebGL2 + Workers JS</strong>, calibré pour les limites Safari/iOS.';
    featuresList.innerHTML = `
      <li>Workers ×${CONFIG.workerMultiplier} (limite imposée par iOS)</li>
      <li>Fractal donut WebGL2, jusqu'à génération ${CONFIG.maxGen}</li>
      <li>Détection iPad, safe-areas, wake-lock</li>
      <li>+1 niveau toutes les ${CONFIG.genIntervalMs/1000} s</li>
    `;
  } else {
    titleWarn.textContent = 'DONUT FRACTAL — WASM';
    descWarn.innerHTML = 'Moteur <strong>WebGL2 + Workers WASM multithreadés</strong>. Un module WebAssembly binaire tourne dans chaque worker.';
    featuresList.innerHTML = `
      <li>Workers ×${CONFIG.workerMultiplier} (oversubscription massive)</li>
      <li>Chaque worker fait tourner un <strong>module WASM binaire</strong> en boucle</li>
      <li>Fractal donut WebGL2, jusqu'à génération <strong>${CONFIG.maxGen}</strong></li>
      <li>+1 niveau toutes les ${CONFIG.genIntervalMs/1000} s</li>
      <li>Fallback automatique sur JS si WASM échoue</li>
    `;
  }

  // ==================================================================
  // RÉFÉRENCES UI
  // ==================================================================
  const $ = (id) => document.getElementById(id);
  const warningScreen = $('warning');
  const startBtn      = $('startBtn');
  const stopBtn       = $('stopBtn');
  const app           = $('app');
  const genEl         = $('genEl');
  const donutsEl      = $('donutsEl');
  const opsEl         = $('opsEl');
  const timerEl       = $('timer');
  const tempFill      = $('tempFill');
  const engineEl      = $('engineEl');
  const resEl         = $('resEl');
  const fpsEl         = $('fps');
  const modeTag       = $('modeTag');
  const canvas        = $('gl');
  const genBanner     = $('generationBanner');

  let running = false;
  let glState = null;
  let startTime = 0;
  let hudRaf = null;
  let workers = [];
  let frameTimes = [];
  let wakeLock = null;
  let genInterval = null;
  let currentGen = 1;
  let wasmFallbackCount = 0;

  // ==================================================================
  // HELPERS — calculs fractale
  // ==================================================================
  function donutCount(gen) {
    let total = 1, layer = 1;
    for (let i = 1; i <= gen; i++) { layer *= 4; total += layer; }
    return total;
  }
  function opsPerPixel(gen) {
    return 80 * donutCount(gen) * 200;
  }
  function formatOps(n) {
    if (n >= 1e9) return `~${(n/1e9).toFixed(1)}G`;
    if (n >= 1e6) return `~${(n/1e6).toFixed(1)}M`;
    if (n >= 1e3) return `~${(n/1e3).toFixed(0)}K`;
    return `~${n}`;
  }

  // ==================================================================
  // WORKER JS (iOS) — boucle lourde avec SDF récursif
  // ==================================================================
  const WORKER_JS_CODE = `
    let running = true;
    let gen = 1;
    self.onmessage = (e) => {
      if (e.data === 'stop') running = false;
      if (e.data && e.data.gen) gen = e.data.gen;
    };
    function tsin(x) {
      x = x - Math.floor((x + 3.14159265) / 6.28318531) * 6.28318531;
      const x2 = x * x;
      let term = x, sum = x;
      for (let i = 1; i < 10; i++) {
        term *= -x2 / ((2*i) * (2*i + 1));
        sum += term;
      }
      return sum;
    }
    function tcos(x) { return tsin(x + 1.5707963); }
    function tsqrt(s) {
      if (s <= 0) return 0;
      let g = s * 0.5 + 0.5;
      for (let i = 0; i < 12; i++) g = 0.5 * (g + s / g);
      return g;
    }
    function sdTorus(px, py, pz, R, r) {
      const rxz2 = px*px + pz*pz;
      const rxz = tsqrt(rxz2);
      let check = 0;
      for (let i = 0; i < 10; i++) check += tsin(i*0.1 + rxz) * tcos(i*0.2);
      rxz += check * 0.0;
      const qx = rxz - R, qy = py;
      return tsqrt(qx*qx + qy*qy) - r;
    }
    function sceneSDF(px, py, pz, depth, time) {
      let d = sdTorus(px, py, pz, 1.0, 0.35);
      if (depth < 1) return d;
      const S1 = 0.4;
      for (let i = 0; i < 4; i++) {
        const a = i * 1.5707963 + time * 0.2;
        const ox = tcos(a) * 1.2, oz = tsin(a) * 1.2;
        const lx = (px - ox) / S1, ly = py / S1, lz = (pz - oz) / S1;
        const d1 = sdTorus(lx, ly, lz, 1.0, 0.4) * S1;
        if (d1 < d) d = d1;
        if (depth < 2) continue;
        for (let j = 0; j < 4; j++) {
          const a2 = j * 1.5707963 - time * 0.3;
          const S2 = S1 * 0.4;
          const ox2 = ox + tcos(a2) * 0.5, oz2 = oz + tsin(a2) * 0.5;
          const lx2 = (px - ox2) / S2, ly2 = py / S2, lz2 = (pz - oz2) / S2;
          const d2 = sdTorus(lx2, ly2, lz2, 1.0, 0.4) * S2;
          if (d2 < d) d = d2;
          if (depth < 3) continue;
          for (let k = 0; k < 4; k++) {
            const a3 = k * 1.5707963 + time * 0.5;
            const S3 = S2 * 0.4;
            const ox3 = ox2 + tcos(a3) * 0.2, oz3 = oz2 + tsin(a3) * 0.2;
            const lx3 = (px - ox3) / S3, ly3 = py / S3, lz3 = (pz - oz3) / S3;
            const d3 = sdTorus(lx3, ly3, lz3, 1.0, 0.4) * S3;
            if (d3 < d) d = d3;
          }
        }
      }
      return d;
    }
    const buf = new Float64Array(4096);
    let bufIdx = 0, t = 0;
    function burn() {
      let total = 0;
      while (running) {
        for (let k = 0; k < 5000; k++) {
          const x = tsin(t * 0.1) * 1.5;
          const y = tcos(t * 0.13) * 0.8;
          const z = tsin(t * 0.07) * 1.5;
          total += sceneSDF(x, y, z, gen, t);
          t += 0.001;
        }
        buf[bufIdx = (bufIdx + 1) & 4095] = total;
      }
    }
    burn();
  `;

  // ==================================================================
  // WORKER WASM (Desktop) — instancie le module binaire et le fait tourner
  // Fallback sur JS si WASM échoue
  // ==================================================================
  const WORKER_WASM_CODE = `
    let running = true;
    let instance = null;
    let wasmReady = false;
    let fellBackToJS = false;

    self.onmessage = async (e) => {
      if (e.data === 'stop') { running = false; return; }

      if (e.data && e.data.wasmBytes) {
        try {
          const res = await WebAssembly.instantiate(e.data.wasmBytes);
          instance = res.instance;
          wasmReady = true;
          self.postMessage({ type: 'ready', engine: 'wasm' });
        } catch (err) {
          // Fallback JS
          fellBackToJS = true;
          self.postMessage({ type: 'ready', engine: 'js-fallback', err: String(err) });
        }
      }

      if (e.data && e.data.start) {
        burnLoop();
      }
    };

    // Fallback : même boucle chaotique, en JS
    function jsBurn(n) {
      let x = 0.5, y = 0.0;
      for (let i = 0; i < n; i++) {
        x = 4.0 * x * (1.0 - x);
        y = y + x;
      }
      return y;
    }

    function burnLoop() {
      if (running) {
        // Continue tant que running est true
        while (running) {
          if (wasmReady && !fellBackToJS) {
            // 20M itérations = ~100 ms de calcul WASM
            instance.exports.burn(20000000);
          } else {
            // Fallback JS : 5M itérations (plus lent, donc moins)
            jsBurn(5000000);
          }
        }
      }
    }
  `;

  // ==================================================================
  // LANCEMENT DES WORKERS (selon mode)
  // ==================================================================
  function launchWorkers() {
    const cores = navigator.hardwareConcurrency || 4;
    const target = cores * CONFIG.workerMultiplier;

    if (CONFIG.mode === 'ios') {
      // Mode iOS : workers JS
      const blob = new Blob([WORKER_JS_CODE], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      for (let i = 0; i < target; i++) {
        try {
          const w = new Worker(url);
          w.postMessage({ gen: currentGen });
          workers.push(w);
        } catch(e) { break; }
      }
      URL.revokeObjectURL(url);
    } else {
      // Mode WASM : chaque worker reçoit une COPIE des bytes WASM (transfert)
      const blob = new Blob([WORKER_WASM_CODE], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      for (let i = 0; i < target; i++) {
        try {
          const w = new Worker(url);
          w.onmessage = (e) => {
            if (e.data && e.data.type === 'ready') {
              if (e.data.engine === 'js-fallback') {
                wasmFallbackCount++;
                engineEl.textContent = 'JS fallback ×' + wasmFallbackCount;
              }
              // Démarre la boucle de burn
              w.postMessage({ start: true });
            }
          };
          // Envoie une copie des bytes (chaque worker a besoin de la sienne)
          const copy = WASM_BYTES.slice().buffer;
          w.postMessage({ wasmBytes: copy }, [copy]);
          workers.push(w);
        } catch(e) { break; }
      }
      URL.revokeObjectURL(url);
    }

    return { count: workers.length, cores };
  }

  function killWorkers() {
    for (const w of workers) {
      try { w.postMessage('stop'); } catch(e) {}
      w.terminate();
    }
    workers = [];
  }
  function updateWorkersGen(gen) {
    // Seuls les workers JS du mode iOS utilisent la profondeur fractale
    if (CONFIG.mode === 'ios') {
      for (const w of workers) {
        try { w.postMessage({ gen }); } catch(e) {}
      }
    }
  }

  // ==================================================================
  // SHADER WebGL2 — fractal donut (identique aux deux modes)
  // ==================================================================
  const VERT = `#version 300 es
    in vec2 p;
    void main() { gl_Position = vec4(p, 0.0, 1.0); }
  `;

  const FRAG = `#version 300 es
    precision highp float;
    uniform vec2 u_res;
    uniform float u_time;
    uniform int u_gen;
    out vec4 outColor;
    const float PI = 3.14159265;

    float tsin(float x) {
      x = x - floor((x + PI) / (2.0 * PI)) * 2.0 * PI;
      float x2 = x * x;
      float term = x, sum = x;
      for (int i = 1; i < 10; i++) {
        term *= -x2 / float((2*i) * (2*i + 1));
        sum += term;
      }
      return sum;
    }
    float tcos(float x) { return tsin(x + PI * 0.5); }

    float tsqrt(float s) {
      if (s <= 0.0) return 0.0;
      float g = s * 0.5 + 0.5;
      for (int i = 0; i < 12; i++) g = 0.5 * (g + s / g);
      return g;
    }
    float tlen2(vec2 v) { return tsqrt(v.x*v.x + v.y*v.y); }

    float sdTorus(vec3 p, float R, float r) {
      float rxz2 = p.x*p.x + p.z*p.z;
      float rxz = tsqrt(rxz2);
      float check = 0.0;
      for (int i = 0; i < 10; i++) {
        check += tsin(float(i) * 0.1 + rxz) * tcos(float(i) * 0.2);
      }
      rxz += check * 0.0;
      vec2 q = vec2(rxz - R, p.y);
      return tlen2(q) - r;
    }

    float sceneSDF(vec3 p) {
      float d = 1e10;
      d = min(d, sdTorus(p, 1.0, 0.35));
      if (u_gen < 1) return d;
      const float S1 = 0.4;
      for (int i = 0; i < 4; i++) {
        float a = float(i) * (PI * 0.5) + u_time * 0.2;
        vec3 off = vec3(tcos(a) * 1.2, 0.0, tsin(a) * 1.2);
        vec3 lp = (p - off) / S1;
        d = min(d, sdTorus(lp, 1.0, 0.4) * S1);
        if (u_gen < 2) continue;
        const float S2 = S1 * 0.4;
        for (int j = 0; j < 4; j++) {
          float a2 = float(j) * (PI * 0.5) - u_time * 0.3;
          vec3 off2 = off + vec3(tcos(a2) * 0.5, 0.0, tsin(a2) * 0.5);
          vec3 lp2 = (p - off2) / S2;
          d = min(d, sdTorus(lp2, 1.0, 0.4) * S2);
          if (u_gen < 3) continue;
          const float S3 = S2 * 0.4;
          for (int k = 0; k < 4; k++) {
            float a3 = float(k) * (PI * 0.5) + u_time * 0.5;
            vec3 off3 = off2 + vec3(tcos(a3) * 0.2, 0.0, tsin(a3) * 0.2);
            vec3 lp3 = (p - off3) / S3;
            d = min(d, sdTorus(lp3, 1.0, 0.4) * S3);
            if (u_gen < 4) continue;
            const float S4 = S3 * 0.4;
            for (int l = 0; l < 4; l++) {
              float a4 = float(l) * (PI * 0.5) - u_time * 0.7;
              vec3 off4 = off3 + vec3(tcos(a4) * 0.08, 0.0, tsin(a4) * 0.08);
              vec3 lp4 = (p - off4) / S4;
              d = min(d, sdTorus(lp4, 1.0, 0.4) * S4);
              if (u_gen < 5) continue;
              const float S5 = S4 * 0.4;
              for (int m = 0; m < 4; m++) {
                float a5 = float(m) * (PI * 0.5) + u_time * 0.9;
                vec3 off5 = off4 + vec3(tcos(a5) * 0.032, 0.0, tsin(a5) * 0.032);
                vec3 lp5 = (p - off5) / S5;
                d = min(d, sdTorus(lp5, 1.0, 0.4) * S5);
                if (u_gen < 6) continue;
                const float S6 = S5 * 0.4;
                for (int n = 0; n < 4; n++) {
                  float a6 = float(n) * (PI * 0.5) - u_time * 1.1;
                  vec3 off6 = off5 + vec3(tcos(a6) * 0.0128, 0.0, tsin(a6) * 0.0128);
                  vec3 lp6 = (p - off6) / S6;
                  d = min(d, sdTorus(lp6, 1.0, 0.4) * S6);
                }
              }
            }
          }
        }
      }
      return d;
    }

    vec3 calcNormal(vec3 p) {
      const float e = 0.0015;
      float dx = sceneSDF(p + vec3(e, 0.0, 0.0)) - sceneSDF(p - vec3(e, 0.0, 0.0));
      float dy = sceneSDF(p + vec3(0.0, e, 0.0)) - sceneSDF(p - vec3(0.0, e, 0.0));
      float dz = sceneSDF(p + vec3(0.0, 0.0, e)) - sceneSDF(p - vec3(0.0, 0.0, e));
      return normalize(vec3(dx, dy, dz));
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
      float ca = tcos(u_time * 0.35);
      float sa = tsin(u_time * 0.35);
      mat3 rot = mat3(ca, 0.0, sa, 0.0, 1.0, 0.0, -sa, 0.0, ca);
      vec3 ro = rot * vec3(0.0, 0.8, 4.0);
      vec3 rd = rot * normalize(vec3(uv, -1.6));

      float t = 0.0;
      float hit = -1.0;
      for (int i = 0; i < 80; i++) {
        vec3 p = ro + rd * t;
        float d = sceneSDF(p);
        if (d < 0.001) { hit = t; break; }
        t += d;
        if (t > 15.0) break;
      }

      vec3 col = vec3(0.0);
      if (hit > 0.0) {
        vec3 p = ro + rd * hit;
        vec3 n = calcNormal(p);
        vec3 lightDir = normalize(vec3(0.8, 1.2, -0.6));
        float diff = max(dot(n, lightDir), 0.0);
        float shadow = clamp(diff, 0.2, 1.0);
        vec3 viewDir = -rd;
        vec3 halfV = normalize(lightDir + viewDir);
        float spec = pow(max(dot(n, halfV), 0.0), 48.0);
        vec3 baseCol = vec3(0.95, 0.55, 0.15);
        float glaze = smoothstep(0.1, 0.5, n.y);
        vec3 glazeCol = vec3(1.0, 0.75, 0.35);
        col = mix(baseCol, glazeCol, glaze) * (0.15 + 0.85 * shadow);
        col += vec3(1.0, 0.9, 0.7) * spec * 0.8;
        float rim = pow(1.0 - max(dot(n, viewDir), 0.0), 3.0);
        col += vec3(1.0, 0.6, 0.3) * rim * 0.25;
      } else {
        float vignette = 1.0 - tlen2(uv) * 0.6;
        col = vec3(0.04, 0.03, 0.06) * vignette;
        col += vec3(0.08, 0.04, 0.02) * smoothstep(0.8, 0.0, tlen2(uv));
      }
      col = pow(col, vec3(0.4545));
      outColor = vec4(col, 1.0);
    }
  `;

  function initGL() {
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprCap);
    const gl = canvas.getContext('webgl2', {
      antialias: false, depth: false, stencil: false,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: false,
      desynchronized: true,
      failIfMajorPerformanceCaveat: false,
    });
    if (!gl) { engineEl.textContent = 'WebGL2 indispo'; return null; }

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error('shader:', gl.getShaderInfoLog(s));
        return null;
      }
      return s;
    }
    const vs = compile(gl.VERTEX_SHADER, VERT);
    const fs = compile(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) { engineEl.textContent = 'Shader refusé'; return null; }

    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('link:', gl.getProgramInfoLog(prog));
      engineEl.textContent = 'Shader trop lourd';
      return null;
    }
    gl.useProgram(prog);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, 'u_res');
    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uGen = gl.getUniformLocation(prog, 'u_gen');

    let W = Math.floor(window.innerWidth * dpr);
    let H = Math.floor(window.innerHeight * dpr);
    canvas.width = W;
    canvas.height = H;
    gl.viewport(0, 0, W, H);

    function resize() {
      W = Math.floor(window.innerWidth * dpr);
      H = Math.floor(window.innerHeight * dpr);
      canvas.width = W;
      canvas.height = H;
      gl.viewport(0, 0, W, H);
      resEl.textContent = `${W}×${H}`;
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => {
      setTimeout(resize, 300);
      setTimeout(resize, 900);
    });

    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      engineEl.textContent = '⚠ GPU perdu';
    });

    return { gl, uRes, uTime, uGen, getW: () => W, getH: () => H };
  }

  function renderLoop() {
    if (!running || !glState) return;
    const { gl, uRes, uTime, uGen } = glState;
    const W = glState.getW(), H = glState.getH();

    const t0 = performance.now();
    gl.uniform2f(uRes, W, H);
    gl.uniform1f(uTime, performance.now() * 0.001);
    gl.uniform1i(uGen, currentGen);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    const dt = performance.now() - t0;
    frameTimes.push(dt);
    if (frameTimes.length > 40) frameTimes.shift();
    const avg = frameTimes.reduce((a,b)=>a+b,0) / frameTimes.length;
    fpsEl.textContent = `${(1000 / Math.max(avg, 0.1)).toFixed(1)} fps · ${dt.toFixed(0)} ms`;

    requestAnimationFrame(renderLoop);
  }

  // ==================================================================
  // RÉGÉNÉRATION
  // ==================================================================
  function startRegeneration() {
    genInterval = setInterval(() => {
      if (!running) return;
      if (currentGen >= CONFIG.maxGen) return;
      currentGen++;
      const donuts = donutCount(currentGen);
      const ops = opsPerPixel(currentGen);
      genEl.textContent = currentGen;
      donutsEl.textContent = `${donuts.toLocaleString('fr-FR')} donuts`;
      opsEl.textContent = formatOps(ops);
      updateWorkersGen(currentGen);

      genBanner.textContent = `GÉN ${currentGen} · ${donuts.toLocaleString('fr-FR')} DONUTS`;
      genBanner.classList.remove('show');
      void genBanner.offsetWidth;
      genBanner.classList.add('show');

      try { navigator.vibrate && navigator.vibrate([30, 30, 30]); } catch(e) {}
    }, CONFIG.genIntervalMs);
  }
  function stopRegeneration() {
    if (genInterval) clearInterval(genInterval);
    genInterval = null;
  }

  // ==================================================================
  // WAKE LOCK
  // ==================================================================
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch(e) {}
  }
  async function releaseWakeLock() {
    if (wakeLock) { try { await wakeLock.release(); } catch(e) {} wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (running && document.visibilityState === 'visible') requestWakeLock();
  });

  // ==================================================================
  // HUD
  // ==================================================================
  function updateHUD() {
    if (!running) return;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    timerEl.textContent = `${mm}:${ss}`;
    const heat = Math.min(100, 15 + elapsed * 4);
    tempFill.style.width = `${heat}%`;
    hudRaf = requestAnimationFrame(updateHUD);
  }

  // ==================================================================
  // START / STOP
  // ==================================================================
  async function start() {
    if (running) return;
    running = true;
    currentGen = 1;
    wasmFallbackCount = 0;
    document.body.style.overflow = 'hidden';

    warningScreen.style.display = 'none';
    app.style.display = 'block';

    modeTag.textContent = isIOS ? '🍎 iOS' : '💻 WASM';
    modeTag.style.color = isIOS ? '#7fb8ff' : '#7fffb8';

    await requestWakeLock();
    glState = initGL();
    if (glState) renderLoop();

    const { count, cores } = launchWorkers();

    genEl.textContent = '1';
    donutsEl.textContent = `${donutCount(1)} donuts`;
    opsEl.textContent = formatOps(opsPerPixel(1));
    engineEl.textContent = CONFIG.engine + ` (${count}/${cores})`;

    startTime = Date.now();
    startRegeneration();
    updateHUD();

    try { navigator.vibrate && navigator.vibrate(80); } catch(e) {}
  }

  async function stop() {
    if (!running) return;
    running = false;

    killWorkers();
    stopRegeneration();
    releaseWakeLock();

    if (hudRaf) cancelAnimationFrame(hudRaf);
    hudRaf = null;

    frameTimes = [];
    fpsEl.textContent = '—';
    timerEl.textContent = '00:00';
    tempFill.style.width = '0%';
    genBanner.classList.remove('show');

    app.style.display = 'none';
    warningScreen.style.display = 'flex';
  }

  // ==================================================================
  // ÉVÉNEMENTS
  // ==================================================================
  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);

  window.addEventListener('beforeunload', () => {
    killWorkers(); releaseWakeLock();
  });
  window.addEventListener('pagehide', () => {
    killWorkers(); releaseWakeLock();
  });

  let lastStopTap = 0;
  stopBtn.addEventListener('touchstart', (e) => {
    const now = Date.now();
    if (now - lastStopTap < 400) {
      e.preventDefault();
      if (running) stop();
    }
    lastStopTap = now;
  }, { passive: false });

  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());
  document.addEventListener('gestureend', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    if (running) e.preventDefault();
  }, { passive: false });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && running) stop();
  });
})();
</script>
</body>
</html>
